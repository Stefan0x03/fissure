name: Lacuna Runner

on:
  issues:
    types: [labeled]
  workflow_run:
    workflows: ["CVE Triage"]
    types: [completed]

concurrency:
  group: lacuna-drain
  cancel-in-progress: false

permissions:
  issues: write
  contents: read

jobs:
  run-lacuna:
    if: github.event_name == 'workflow_run' || github.event.label.name == 'approved'
    name: Run Lacuna scan for issue #${{ github.event.issue.number }}
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Mark issue in-progress
        if: github.event_name == 'issues'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/labels \
            -d '{"labels":["in-progress"]}'

      - name: Extract handoff YAML from triage comment
        if: github.event_name == 'issues'
        id: extract
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m scripts.lacuna_runner extract \
            --issue ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --output /tmp/handoff.yaml

      - name: Read Lacuna commit SHA from config
        id: lacuna-ref
        run: |
          LACUNA_REF=$(python -c "from config.settings import LACUNA_COMMIT_SHA; print(LACUNA_COMMIT_SHA)")
          
          # SECURITY: Validate that LACUNA_COMMIT_SHA is a 40-character hex string (git SHA).
          # This prevents supply-chain attacks via mutable branch references or placeholder values.
          if ! echo "$LACUNA_REF" | grep -qE '^[0-9a-fA-F]{40}$'; then
            echo "::error::LACUNA_COMMIT_SHA in config/settings.py must be a 40-character commit SHA."
            echo "::error::Current value: $LACUNA_REF"
            echo "::error::To fix: audit Stefan0x03/lacuna at your target commit, verify no malicious"
            echo "::error::code in setup.py, build scripts, or CLI entry points, then set the SHA."
            exit 1
          fi
          
          echo "LACUNA_REF=$LACUNA_REF" >> $GITHUB_ENV

      - name: Checkout Lacuna
        uses: actions/checkout@v4
        with:
          repository: Stefan0x03/lacuna
          # SECURITY: Pin to immutable commit SHA to prevent supply-chain attacks.
          # This checkout is installed in editable mode and executed with ANTHROPIC_API_KEY
          # and GITHUB_TOKEN in scope. The SHA is configured in config/settings.py as
          # LACUNA_COMMIT_SHA. To update: audit the target commit, verify no malicious
          # code in setup.py, build scripts, or CLI entry points, then update the SHA.
          ref: ${{ env.LACUNA_REF }}
          path: lacuna
          token: ${{ secrets.LACUNA_TOKEN }}

      - name: Install Lacuna
        run: pip install -e lacuna

      - name: Build Lacuna sandbox image
        run: ./scripts/build_sandbox.sh
        working-directory: lacuna

      - name: Run lacuna scan
        if: github.event_name == 'issues' && steps.extract.outcome == 'success'
        id: scan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          MODEL=$(python -c "from config.settings import LACUNA_MODEL; print(LACUNA_MODEL)")
          ITERATIONS=$(python -c "from config.settings import LACUNA_MAX_ITERATIONS; print(LACUNA_MAX_ITERATIONS)")
          cd lacuna
          # Per-scan cap so one stuck scan can't consume the whole job budget.
          timeout 60m lacuna scan /tmp/handoff.yaml \
            --model "$MODEL" \
            --max-iterations "$ITERATIONS" \
            --verbose
        continue-on-error: true

      - name: Post results and update labels
        if: github.event_name == 'issues'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m scripts.lacuna_runner post-results \
            --issue ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --lacuna-dir lacuna \
            --scan-outcome ${{ steps.extract.outcome == 'success' && steps.scan.outcome || 'failure' }}

      - name: Drain remaining approved queue
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          SKIP="${{ github.event.issue.number }}"
          SKIP_ARG=""
          if [ -n "$SKIP" ]; then
            SKIP_ARG="--skip-issue $SKIP"
          fi

          QUEUE=$(python -m scripts.lacuna_runner list-queue \
            --repo ${{ github.repository }} \
            $SKIP_ARG)

          if [ -z "$QUEUE" ]; then
            echo "No queued approved issues found."
            exit 0
          fi

          MODEL=$(python -c "from config.settings import LACUNA_MODEL; print(LACUNA_MODEL)")
          ITERATIONS=$(python -c "from config.settings import LACUNA_MAX_ITERATIONS; print(LACUNA_MAX_ITERATIONS)")

          for ISSUE in $QUEUE; do
            echo "--- Draining issue #$ISSUE ---"

            curl -s -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/${{ github.repository }}/issues/${ISSUE}/labels \
              -d '{"labels":["in-progress"]}'

            python -m scripts.lacuna_runner extract \
              --issue "$ISSUE" \
              --repo ${{ github.repository }} \
              --output "/tmp/handoff_${ISSUE}.yaml" || {
                echo "Extraction failed for issue #$ISSUE — marking failed and continuing."
                python -m scripts.lacuna_runner post-results \
                  --issue "$ISSUE" \
                  --repo ${{ github.repository }} \
                  --lacuna-dir lacuna \
                  --scan-outcome failure
                continue
              }

            cd lacuna
            timeout 60m lacuna scan "/tmp/handoff_${ISSUE}.yaml" \
              --model "$MODEL" \
              --max-iterations "$ITERATIONS" \
              --verbose && OUTCOME=success || OUTCOME=failure
            cd ..

            python -m scripts.lacuna_runner post-results \
              --issue "$ISSUE" \
              --repo ${{ github.repository }} \
              --lacuna-dir lacuna \
              --scan-outcome "$OUTCOME"
          done
